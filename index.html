<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="松山大学 学内リンク集 — クリック数順で並ぶ、タグで絞り込める学内リンクポータル。" />
  <title>松山大学 リンク集</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#main">本文へスキップ</a>

  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">松山大学 リンク集 <span>Matsuyama University Links Portal</span></h1>
    </div>
  </header>

  <main id="main">
    <section class="section" aria-label="学内リンク一覧">
      <div class="controls" aria-label="絞り込みコントロール">
        <div class="tag-filter" id="tag-filter" role="group" aria-label="タグで絞り込み"></div>
        <button type="button" class="reset-button" id="reset-clicks">クリック数をリセット</button>
      </div>

      <div class="card-grid" id="links-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-links">
      <a href="https://www.matsuyama-u.ac.jp/" target="_blank" rel="noopener noreferrer">松山大学 公式サイト</a>
      <a href="https://libweb.matsuyama-u.jp/drupal/" target="_blank" rel="noopener noreferrer">図書館 OPAC</a>
    </div>
    <p>© 松山大学 — このページは学生・教職員向けリンク集です</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
